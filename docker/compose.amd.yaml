# AMD Radeon / VAAPI compose override
# Usage:
#   docker compose -f docker/compose.yaml -f docker/compose.amd.yaml up -d
#
# AMD GPUs use the radeonsi Mesa VAAPI driver and typically require access
# to /dev/dri/renderD128 and /dev/kfd, with render and video group membership.

services:
  hearth:
    environment:
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME:-radeonsi}
    devices:
      - ${RENDER_DEVICE:-/dev/dri/renderD128}:/dev/dri/renderD128
      - /dev/kfd:/dev/kfd
    group_add:
      - ${RENDER_GID:-105}
      - ${VIDEO_GID:-44}
  worker:
    environment:
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME:-radeonsi}
    devices:
      - ${RENDER_DEVICE:-/dev/dri/renderD128}:/dev/dri/renderD128
      - /dev/kfd:/dev/kfd
    group_add:
      - ${RENDER_GID:-105}
      - ${VIDEO_GID:-44}
