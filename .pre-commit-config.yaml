# Local hooks mirroring CI. Install with: uvx pre-commit install
# (No project dependency is required; pre-commit runs the hooks itself.)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^docker/compose\.cpu\.yaml$
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
