name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.10.7"
          python-version: "3.12"
          enable-cache: true
          # Fetch uv from the Astral mirror instead of GitHub Releases,
          # which intermittently returns 504. v10 also runs on Node 24,
          # removing the punycode deprecation warning from v6.
          download-from-astral-mirror: true

      - name: Install ffmpeg
        # The runner image no longer ships ffmpeg; the integration suite
        # exercises real transcode paths and fails without it.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          ffmpeg -version | head -1

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy app

      - name: Check committed OpenAPI schema
        run: uv run python scripts/export_openapi.py --check

      - name: Test
        shell: bash
        run: |
          set +e
          uv run pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the failing tests as annotations (publicly readable even
            # without repo admin, unlike the job logs).
            grep -E '^(FAILED|ERROR) ' pytest.log | while IFS= read -r line; do
              echo "::error file=tests::${line}"
            done
          fi
          exit "$status"

      - name: Build wheel
        run: uv build

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Type check
        run: npm run check
        working-directory: web

      - name: Build static SPA
        run: npm run build
        working-directory: web

  container:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t hearth:ci .

      - name: Start container without a GPU
        run: |
          docker run -d --name hearth-ci \
            --read-only \
            --tmpfs /config:size=64m,mode=1777 \
            --tmpfs /transcode:size=1g,mode=1777 \
            --tmpfs /tmp:size=64m \
            -p 8000:8000 \
            hearth:ci

      - name: Verify health contract
        shell: bash
        run: |
          set +e
          python - <<'PY' 2>&1 | tee health.log
          import json
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/api/v1/health"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      health = json.load(response)
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(2)

          print(json.dumps(health, indent=2))
          assert health["status"] == "ok", health
          assert health["ffmpeg"]["status"] == "ok", health
          assert health["ffmpeg"]["version"], health
          assert health["vaapi"]["status"] == "unavailable", health
          assert health["database"]["status"] in {"ok", "not_initialized"}, health
          PY
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Annotations are readable without admin rights; job logs are not.
            echo "::error file=docker/Dockerfile::health contract failed: $(tail -n 5 health.log | tr '\n' ' ')"
          fi
          exit "$status"

      - name: Verify container runs unprivileged
        run: |
          test "$(docker exec hearth-ci id -u)" = "1000"
          test "$(docker exec hearth-ci id -g)" = "1000"

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.10.7"
          python-version: "3.12"
          enable-cache: true
          # Fetch uv from the Astral mirror instead of GitHub Releases,
          # which intermittently returns 504. v10 also runs on Node 24,
          # removing the punycode deprecation warning from v6.
          download-from-astral-mirror: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Verify backup and restore into a fresh container
        env:
          HEARTH_CONTAINER_E2E: "1"
          HEARTH_E2E_IMAGE: hearth:ci
        run: uv run pytest tests/e2e -q

      - name: Dump container logs on failure
        if: failure()
        run: docker logs hearth-ci

      - name: Stop container
        if: always()
        run: docker rm -f hearth-ci || true

  e2e:
    name: Playwright UI tests against the Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run e2e suite against a fresh container
        shell: bash
        run: |
          set +e
          ./scripts/e2e.sh 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Annotations are readable without admin rights; job logs are not.
            grep -E '^[[:space:]]+[0-9]+\)' e2e.log | while IFS= read -r line; do
              echo "::error file=web/e2e::${line}"
            done
            if ! grep -qE '^[[:space:]]+[0-9]+\)' e2e.log; then
              echo "::error file=scripts/e2e.sh::e2e failed: $(tail -n 8 e2e.log | tr '\n' ' ')"
            fi
          fi
          exit "$status"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
