[project]
name = "hearth"
version = "0.1.0"
description = "Self-hosted personal media server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "guessit>=4.4.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "blurhash>=1.1.5",
    "watchfiles>=1.3.0",
    "mutagen>=1.47.0",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "rarfile>=4.2",
]

[project.scripts]
hearth = "app.cli:app"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["blurhash.*", "mutagen.*", "pypdfium2.*", "rarfile.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.services.media.tags"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "vaapi: tests requiring VAAPI hardware acceleration (/dev/dri/renderD128)",
    "container_e2e: container-level end-to-end tests driven by Docker (opt-in via HEARTH_CONTAINER_E2E=1)",
]
